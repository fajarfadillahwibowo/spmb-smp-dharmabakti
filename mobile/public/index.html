<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <title>SPMB SMP Dharma Bakti Mobile</title>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0F172A;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        min-height: 100vh;
      }
      /* Centering container for desktop view to look like a clean mobile preview */
      @media (min-width: 600px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
        }
        #root {
          max-width: 440px;
          height: 92vh;
          min-height: 700px;
          max-height: 900px;
          border-radius: 36px;
          overflow: hidden;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 10px #1E293B;
          border: 4px solid #334155;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Anda perlu mengaktifkan JavaScript untuk menjalankan aplikasi SPMB ini.</noscript>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById('debug-error-box');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-box';
          errDiv.style = 'position:fixed;bottom:10px;left:10px;right:10px;background:#ef4444;color:white;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;z-index:99999;word-break:break-all;box-shadow:0 10px 15px -3px rgba(0,0,0,0.5);';
          document.body.appendChild(errDiv);
        }
        errDiv.innerText = 'JS Error: ' + msg + ' (Line: ' + line + ')';
      };
    </script>
  </body>
</html>
